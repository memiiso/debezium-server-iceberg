name: Build Java Project

on:
  push:
    branches: [ master, '*.*' ]
    paths-ignore:
      - '.idea/**'
      - '.run/**'
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.run/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPARK_LOCAL_IP: 127.0.0.1

jobs:
  check-code-formatting:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'
      - name: Check Code Formatting
        run: mvn spotless:check

  build-and-test:
    name: Build-Test (${{ matrix.format.name }})
    runs-on: ubuntu-latest
    needs: check-code-formatting
    strategy:
      fail-fast: false
      matrix:
        format:
          - { key: json, value: json, name: "Json Format" }
          - { key: connect, value: connect, name: "Connect Format" }
    env:
      DEBEZIUM_FORMAT_VALUE: ${{ matrix.format.value }}
      DEBEZIUM_FORMAT_KEY: ${{ matrix.format.key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'
      - name: Build with Maven (${{ matrix.format.name }})
        run: mvn -B --no-transfer-progress package --file pom.xml -Dsurefire.skipAfterFailureCount=1 -Dspotless.check.skip=true
